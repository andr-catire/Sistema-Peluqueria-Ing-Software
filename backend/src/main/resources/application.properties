# Lee backend/.env al correr en local (Spring no lo hace por defecto). El .env NO se sube a Git.
# Las variables y el origen de cada valor están documentados en README.md.
spring.config.import=optional:file:.env[.properties]

spring.application.name=peluqueria
server.port=${PORT:3000}
# Detrás de un proxy (Render, etc.) respeta X-Forwarded-For/Proto.
server.forward-headers-strategy=framework

# Neon (PostgreSQL). Las credenciales vienen del entorno; aquí nunca van valores reales.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate administra el esquema durante el desarrollo (crea y actualiza tablas).
# TEMPORAL: en esta iteración no se usa Flyway; se reintroducirá más adelante.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Todo en español (Content-Language: es, fechas y mensajes).
spring.web.locale=es
spring.web.locale-resolver=fixed

# Imágenes de servicios: la app reduce a WebP en el navegador; el backend acepta hasta 10 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Propiedades de la aplicación
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:86400}
app.telefono-peluqueria=${TELEFONO_PELUQUERIA:}
# TEMPORAL: HTTP Basic para probar la API sin frontend ni login. Nunca activar en producción.
app.basic-auth=${APP_BASIC_AUTH:false}
