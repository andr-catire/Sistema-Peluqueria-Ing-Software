# Lee backend/.env al correr en local (Spring no lo hace por defecto). El .env NO se sube a Git.
# Las variables y el origen de cada valor están documentados en README.md.
spring.config.import=optional:file:.env[.properties]

spring.application.name=peluqueria
server.port=${PORT:3000}
# Detrás de un proxy (Render, etc.) respeta X-Forwarded-For/Proto.
server.forward-headers-strategy=framework

# Neon (PostgreSQL). Las credenciales vienen del entorno; aquí nunca van valores reales.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway usa la conexión directa (sin -pooler); si no existe DB_DIRECT_URL usa DB_URL.
spring.flyway.url=${DB_DIRECT_URL:${DB_URL}}
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PASSWORD}

# El esquema solo cambia con migraciones Flyway (db/migration). Hibernate únicamente valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Todo en español (Content-Language: es, fechas y mensajes).
spring.web.locale=es
spring.web.locale-resolver=fixed

# Propiedades de la aplicación
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.admin.email=${APP_ADMIN_EMAIL:admin@peluqueria.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin1234*}
app.jwt.secret=${JWT_SECRET:clave_secreta_para_desarrollo_local_segura_peluqueria_2026_ucab}
app.telefono-peluqueria=${TELEFONO_PELUQUERIA:}
