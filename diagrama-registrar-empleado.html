<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar empleado · Diagrama de secuencia</title>
  <style>
    html, body { margin: 0; background: #ffffff; color: #0d2b52; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    #diagrama { padding: 24px; overflow: auto; }
    #diagrama svg { max-width: none; height: auto; }
    .error { padding: 24px; color: #0d2b52; font-size: 14px; }
  </style>
</head>
<body>
  <div id="diagrama"></div>

  <script type="text/plain" id="codigo">
sequenceDiagram
    autonumber
    actor C as Cliente
    actor A as Administrador
    actor P as Estilista autenticado
    participant FE as Frontend Vue
    participant AC as AuthController
    participant AS as AuthService
    participant EC as EstilistaController
    participant ES as EstilistaService
    participant UAC as UsuarioActual
    participant RU as RepositorioUsuario
    participant RC as RepositorioCliente
    participant RE as RepositorioEstilista
    participant RS as RepositorioServicio
    participant DB as PostgreSQL en Neon

    Note over C,DB: PASO 1 - Registro público - POST /api/auth/registro
    C->>FE: Completa nombre, correo, contraseña, cédula y teléfono
    FE->>AC: POST /api/auth/registro con RegistroRequest
    AC->>AS: registrar(solicitud)
    AS->>RU: existsByEmailIgnoreCase(correo normalizado)
    RU->>DB: SELECT de usuarios por correo
    DB-->>RU: resultado
    RU-->>AS: true o false
    alt El correo ya está registrado
        AS-->>AC: ExcepcionReglaNegocio EMAIL_TAKEN con estado 409
        AC-->>FE: 409 Conflict
        FE-->>C: Muestra el error y no crea la cuenta
    else El correo está libre
        AS->>RC: existsByCedulaIgnoreCase(cédula)
        RC->>DB: SELECT de clientes por cédula
        DB-->>RC: resultado
        RC-->>AS: true o false
        alt La cédula ya está registrada
            AS-->>AC: ExcepcionReglaNegocio CEDULA_TAKEN con estado 409
            AC-->>FE: 409 Conflict
            FE-->>C: Muestra el error y no crea la cuenta
        else Cédula y correo disponibles
            AS->>AS: passwordEncoder.encode(contraseña)
            AS->>AS: new Cliente con Rol.CLIENTE y activo en true
            AS->>RC: save(cliente)
            RC->>DB: INSERT en usuarios y en clientes
            DB-->>RC: id generado
            RC-->>AS: Cliente persistido
            AS-->>AC: RegistroRespuesta con id, nombre, correo y rol
            AC-->>FE: 201 Created
            FE-->>C: Cuenta creada sin token, el login es otra historia
        end
    end

    Note over A,DB: PASO 2 - Búsqueda de una cuenta CLIENTE - GET /api/personal/buscar?email=...
    A->>FE: Escribe el correo de la cuenta que quiere promocionar
    FE->>EC: GET /api/personal/buscar con el correo
    EC->>EC: @PreAuthorize hasRole('ADMIN')
    alt La sesión no es de administrador
        EC-->>FE: 403 Forbidden
        FE-->>A: Muestra que no tiene permisos
    else La sesión es de administrador
        EC->>ES: buscarPorEmail(email)
        ES->>RU: findByEmailIgnoreCase(email normalizado)
        RU->>DB: SELECT de usuarios por correo
        DB-->>RU: fila o vacío
        RU-->>ES: Optional de Usuario
        alt La cuenta no existe
            ES-->>EC: ExcepcionRecursoNoEncontrado con estado 404
            EC-->>FE: 404 Not Found
            FE-->>A: Muestra que no existe la cuenta
        else La cuenta existe
            alt El rol no es CLIENTE
                ES-->>EC: ExcepcionReglaNegocio NOT_PROMOTABLE con estado 409
                EC-->>FE: 409 Conflict
                FE-->>A: Indica que la cuenta ya no se puede promover
            else El rol es CLIENTE
                ES-->>EC: UsuarioBusquedaRespuesta con id, nombre, correo y rol
                EC-->>FE: 200 OK
                FE-->>A: Autocompleta el formulario de promoción
            end
        end
    end

    Note over A,DB: PASO 3 - Promoción a estilista - POST /api/personal/promover
    A->>FE: Envía idUsuario y serviciosIds
    FE->>EC: POST /api/personal/promover con EstilistaRequest
    EC->>EC: @PreAuthorize hasRole('ADMIN')
    alt La sesión no es de administrador
        EC-->>FE: 403 Forbidden
    else La sesión es de administrador
        EC->>ES: promoverAEmpleado(solicitud) dentro de @Transactional
        ES->>RU: findById(idUsuario)
        RU->>DB: SELECT de usuarios por id
        DB-->>RU: fila o vacío
        RU-->>ES: Optional de Usuario
        alt La cuenta no existe
            ES-->>EC: ExcepcionRecursoNoEncontrado con estado 404
            EC-->>FE: 404 Not Found
        else La cuenta existe
            alt El rol es ADMIN
                ES-->>EC: ExcepcionReglaNegocio INVALID_ROLE con estado 409
                EC-->>FE: 409 Conflict
            else El rol es PERSONAL
                ES-->>EC: ExcepcionReglaNegocio ALREADY_EMPLOYEE con estado 409
                EC-->>FE: 409 Conflict
            else El rol es CLIENTE
                ES->>RS: findAllById(serviciosIds)
                RS->>DB: SELECT de servicios por id
                DB-->>RS: filas encontradas
                RS-->>ES: List de Servicio
                alt Falta algún servicio solicitado
                    ES-->>EC: ExcepcionRecursoNoEncontrado con estado 404
                    EC-->>FE: 404 Not Found
                else Todos los servicios existen
                    alt Algún servicio está inactivo
                        ES-->>EC: ExcepcionReglaNegocio INACTIVE_SERVICE con estado 409
                        EC-->>FE: 409 Conflict
                    else Todos los servicios están activos
                        ES->>RC: existePerfil(idUsuario)
                        RC->>DB: SELECT EXISTS en clientes
                        DB-->>RC: true o false
                        RC-->>ES: tieneFichaCliente
                        alt La cuenta tiene ficha de cliente
                            ES->>RC: tieneCitas(idUsuario)
                            RC->>DB: SELECT EXISTS en citas
                            DB-->>RC: true o false
                            RC-->>ES: tieneCitas
                            alt La cuenta tiene citas como cliente
                                ES-->>EC: ExcepcionReglaNegocio CLIENT_WITH_APPOINTMENTS con estado 409
                                EC-->>FE: 409 Conflict
                                FE-->>A: Pide reasignar o cancelar las citas
                            else La cuenta no tiene citas
                                ES->>ES: usuario.setRol(Rol.PERSONAL)
                                ES->>RU: saveAndFlush(usuario)
                                RU->>DB: UPDATE de usuarios con rol PERSONAL
                                ES->>RC: eliminarPerfil(idUsuario)
                                RC->>DB: DELETE FROM clientes
                                ES->>RE: insertarPerfil(idUsuario)
                                RE->>DB: INSERT en personal con ON CONFLICT DO NOTHING
                                loop Por cada servicio solicitado
                                    ES->>RE: asignarServicio(idUsuario, idServicio)
                                    RE->>DB: INSERT en personal_servicios con ON CONFLICT DO NOTHING
                                end
                                ES-->>EC: EstilistaRespuesta con los servicios asignados
                                EC-->>FE: 201 Created
                                FE-->>A: Confirma el estilista promovido y la cuenta deja de ser cliente
                            end
                        else La cuenta no tiene ficha de cliente
                            ES->>ES: usuario.setRol(Rol.PERSONAL)
                            ES->>RU: saveAndFlush(usuario)
                            RU->>DB: UPDATE de usuarios con rol PERSONAL
                            ES->>RE: insertarPerfil(idUsuario)
                            RE->>DB: INSERT en personal con ON CONFLICT DO NOTHING
                            loop Por cada servicio solicitado
                                ES->>RE: asignarServicio(idUsuario, idServicio)
                                RE->>DB: INSERT en personal_servicios con ON CONFLICT DO NOTHING
                            end
                            ES-->>EC: EstilistaRespuesta con los servicios asignados
                            EC-->>FE: 201 Created
                            FE-->>A: Confirma el estilista promovido
                        end
                    end
                end
            end
        end
    end

    Note over P,DB: PASO 4 - Perfil del estilista - GET /api/personal/mi-perfil
    P->>FE: Abre su perfil
    FE->>EC: GET /api/personal/mi-perfil con Authorization Bearer JWT
    EC->>EC: @PreAuthorize hasRole('PERSONAL')
    alt La sesión no es de personal
        EC-->>FE: 403 Forbidden
    else La sesión es de personal
        EC->>UAC: id()
        UAC->>UAC: SecurityContextHolder.getContext().getAuthentication()
        UAC->>RU: findByEmailIgnoreCase(correo del token)
        RU->>DB: SELECT de usuarios por correo
        DB-->>RU: fila
        RU-->>UAC: Usuario autenticado
        UAC-->>EC: idUsuario tomado del token y nunca de la URL
        EC->>ES: obtenerMiPerfil(idUsuario)
        ES->>RE: existePerfil(idUsuario)
        RE->>DB: SELECT EXISTS en personal
        DB-->>RE: true o false
        RE-->>ES: existePerfil
        alt No existe la fila personal
            ES-->>EC: ExcepcionRecursoNoEncontrado con estado 404
            EC-->>FE: 404 Not Found
        else La fila personal existe
            ES->>RU: findById(idUsuario)
            RU->>DB: SELECT de usuarios por id
            DB-->>RU: fila
            RU-->>ES: Usuario
            ES->>RE: buscarServicios(idUsuario)
            RE->>DB: SELECT de servicios con personal_servicios
            DB-->>RE: servicios asignados
            RE-->>ES: List de Servicio
            ES-->>EC: EstilistaRespuesta con la lista de ServicioRespuesta
            EC-->>FE: 200 OK
            FE-->>P: Muestra su perfil y sus servicios asignados
        end
    end

    Note over A,DB: PASO 5 - Desvinculación segura - DELETE /api/personal/{idEstilista}/desvincular
    A->>FE: Elige el estilista que quiere desvincular
    FE->>EC: DELETE /api/personal/{idEstilista}/desvincular
    EC->>EC: @PreAuthorize hasRole('ADMIN')
    alt La sesión no es de administrador
        EC-->>FE: 403 Forbidden
    else La sesión es de administrador
        EC->>ES: desvincularEstilista(idEstilista) dentro de @Transactional
        ES->>RE: existePerfil(idEstilista)
        RE->>DB: SELECT EXISTS en personal
        DB-->>RE: true o false
        RE-->>ES: existePerfil
        alt El estilista no existe
            ES-->>EC: ExcepcionRecursoNoEncontrado con estado 404
            EC-->>FE: 404 Not Found
        else El estilista existe
            ES->>RU: findById(idEstilista)
            RU->>DB: SELECT de usuarios por id
            DB-->>RU: fila o vacío
            RU-->>ES: Optional de Usuario
            alt El usuario no existe
                ES-->>EC: ExcepcionRecursoNoEncontrado con estado 404
                EC-->>FE: 404 Not Found
            else El usuario existe
                alt El rol no es PERSONAL
                    ES-->>EC: ExcepcionReglaNegocio NOT_EMPLOYEE con estado 409
                    EC-->>FE: 409 Conflict
                else El estilista está activo
                    ES->>RE: tieneCitasFuturasActivas(idEstilista)
                    RE->>DB: SELECT EXISTS en citas y agendas con estado PENDIENTE o CONFIRMADA y fecha mayor o igual a hoy
                    DB-->>RE: true o false
                    RE-->>ES: tieneCitasFuturasActivas
                    alt Tiene citas futuras pendientes o confirmadas
                        ES-->>EC: ExcepcionReglaNegocio PENDING_APPOINTMENTS con estado 409
                        EC-->>FE: 409 Conflict
                        FE-->>A: Pide reasignar o cancelar las citas antes de desvincular
                    else No tiene citas futuras activas
                        ES->>RE: eliminarServicios(idEstilista)
                        RE->>DB: DELETE de personal_servicios
                        ES->>RU: actualizarRol(idEstilista, Rol.CLIENTE)
                        RU->>DB: UPDATE de usuarios con rol CLIENTE
                        Note over RE,DB: No se ejecuta delete() sobre personal porque citas y asistencias la referencian
                        ES-->>EC: Operación completada
                        EC-->>FE: 204 No Content
                        FE-->>A: Confirma la desvinculación
                    end
                end
            end
        end
    end
  </script>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    (function () {
      var fuente = document.getElementById('codigo').textContent.trim();
      var contenedor = document.getElementById('diagrama');

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        theme: 'base',
        themeVariables: {
          background: '#ffffff',
          primaryColor: '#e8f1f7',
          primaryTextColor: '#0d2b52',
          primaryBorderColor: '#0d2b52',
          lineColor: '#0d2b52',
          textColor: '#0d2b52',
          actorBkg: '#ffffff',
          actorBorder: '#0d2b52',
          actorTextColor: '#0d2b52',
          signalColor: '#0d2b52',
          signalTextColor: '#0d2b52',
          noteBkgColor: '#e8f1f7',
          noteBorderColor: '#0d2b52',
          noteTextColor: '#0d2b52',
          fontSize: '13px'
        }
      });

      mermaid.render('diagramaRegistrarEmpleado', fuente)
        .then(function (resultado) {
          contenedor.innerHTML = resultado.svg;
        })
        .catch(function () {
          contenedor.innerHTML = '<p class="error">No se pudo dibujar el diagrama. Revisa el código Mermaid.</p>';
        });
    })();
  </script>
</body>
</html>
